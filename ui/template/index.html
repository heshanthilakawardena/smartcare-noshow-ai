<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCare Hospital AI - Agent Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="dark-theme chat-mode">

    <!-- Top Navigation Bar -->
    <nav class="top-navbar">
        <div class="nav-brand">
            <i class="fa-solid fa-hospital-user brand-icon"></i>
            <span class="brand-name">SmartCare Hospital</span>
        </div>
        <div class="nav-actions">
            <button type="button" id="theme-toggle-btn" class="theme-toggle-btn" title="Toggle Light/Dark Theme">
                <i class="fa-solid fa-moon icon-moon"></i>
                <i class="fa-solid fa-sun icon-sun"></i>
                <span id="theme-toggle-text">Dark Mode</span>
            </button>
        </div>
    </nav>

    <!-- Main Chat Area -->
    <main class="chat-container" id="chat-container">

        <!-- Welcome Message from AI -->
        <div class="chat-message agent">
            <div class="chat-avatar">
                <i class="fa-solid fa-robot"></i>
            </div>
            <div class="chat-bubble">
                <div class="chat-sender-name">SmartCare Agent</div>
                <p class="greeting-text">Hello! Please provide the patient's details below and click predict.</p>

                <form id="prediction-form">
                    <!-- Form Layout: Linear row with increasing widths -->
                    <div class="form-layout chat-form-layout">

                        <!-- 1. Patient Info (Narrowest) -->
                        <div class="section-card section-card--sm">
                            <div class="section-header">
                                <i class="fa-solid fa-user section-icon"></i> Patient Info
                            </div>
                            <div class="card-form-grid">
                                <div class="form-group">
                                    <label for="age">Age</label>
                                    <input type="number" id="age" class="form-control" min="0" max="100" value="40"
                                        required>
                                </div>
                                <div class="form-group">
                                    <label for="gender">Gender</label>
                                    <select id="gender" class="form-control" required>
                                        <option value="Male">Male</option>
                                        <option value="Female">Female</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="bmi">BMI</label>
                                    <input type="number" id="bmi" class="form-control" step="0.1" min="10.0" max="60.0"
                                        value="25.0" required>
                                </div>
                            </div>
                        </div>

                        <!-- 2. Appointment Details (Medium) -->
                        <div class="section-card section-card--md">
                            <div class="section-header">
                                <i class="fa-solid fa-calendar-days section-icon"></i> Appointment
                            </div>
                            <div class="card-form-grid appt-grid">
                                <div class="form-group">
                                    <label for="department">Department</label>
                                    <select id="department" class="form-control" required>
                                        <option value="Cardiology">Cardiology</option>
                                        <option value="Neurology">Neurology</option>
                                        <option value="General Medicine" selected>General Medicine</option>
                                        <option value="Orthopedics">Orthopedics</option>
                                        <option value="Dermatology">Dermatology</option>
                                        <option value="ENT">ENT</option>
                                        <option value="Pediatrics">Pediatrics</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="diagnosis">Diagnosis</label>
                                    <select id="diagnosis" class="form-control" required>
                                        <option value="Diabetes">Diabetes</option>
                                        <option value="Hypertension" selected>Hypertension</option>
                                        <option value="Migraine">Migraine</option>
                                        <option value="Asthma">Asthma</option>
                                        <option value="Back Pain">Back Pain</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="appointment_date">Appointment Date</label>
                                    <input type="date" id="appointment_date" class="form-control" required>
                                </div>
                                <div class="form-group">
                                    <label for="waiting_days">Waiting Days</label>
                                    <input type="number" id="waiting_days" class="form-control" min="0" max="365"
                                        value="5" required>
                                </div>
                            </div>
                        </div>

                        <!-- 3. History & Billing (Widest) -->
                        <div class="section-card section-card--lg">
                            <div class="section-header">
                                <i class="fa-solid fa-clock-rotate-left section-icon"></i> History &amp; Billing
                            </div>
                            <div class="card-form-grid history-grid">
                                <div class="form-group">
                                    <label for="previous_appointments">Previous Appointments</label>
                                    <input type="number" id="previous_appointments" class="form-control" min="0"
                                        max="100" value="2" required>
                                </div>
                                <div class="form-group">
                                    <label for="missed_previous_appointments">Missed Appointments</label>
                                    <input type="number" id="missed_previous_appointments" class="form-control" min="0"
                                        max="100" value="0" required>
                                </div>
                                <div class="form-group">
                                    <label for="consultation_fee_lkr">Consultation Fee (LKR) <span
                                            class="optional-badge">Optional</span></label>
                                    <input type="number" id="consultation_fee_lkr" class="form-control" min="0"
                                        max="500000" value="2000">
                                </div>
                            </div>
                        </div>

                    </div>
                </form>
            </div>
        </div>

        <!-- Chat interactions will be injected here dynamically -->
        <div id="chat-insertion-point"></div>

    </main>

    <!-- Floating Action Bar (Controls) -->
    <div class="floating-controls-container">
        <div class="floating-controls-inner">
            <div class="control-group">
                <i class="fa-solid fa-brain control-icon"></i>
                <select id="model-select" name="model" class="form-control select-model">
                    <option value="Logistic Regression" selected>Logistic Regression</option>
                    <option value="KNN">KNN Model</option>
                </select>
            </div>

            <button type="button" id="btn-fill-demo" class="btn-action btn-demo" title="Auto-fill Data">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                <span class="btn-text-hide-mobile">Auto fill Sample</span>
            </button>

            <!-- Tied to the form programmatically in JS -->
            <button type="button" id="btn-submit-external" class="btn-action btn-submit">
                <span id="btn-spinner" class="spinner"></span>
                <span id="btn-text"><i class="fa-solid fa-paper-plane"></i> Predict Now</span>
            </button>
        </div>
    </div>

    <!-- Hidden Template for User Message -->
    <template id="tpl-user-msg">
        <div class="chat-message user animate-pop-in">
            <div class="chat-bubble user-bubble">
                <div class="chat-sender-name">SmartCare Staff</div>
                <p>Please predict weather patient attend or not using <strong class="msg-model-name"></strong>.</p>
            </div>
            <div class="chat-avatar user-avatar">
                <i class="fa-solid fa-user-doctor"></i>
            </div>
        </div>
    </template>

    <!-- Hidden Template for Agent Loading Message -->
    <template id="tpl-agent-loading">
        <div class="chat-message agent animate-pop-in" id="loading-message">
            <div class="chat-avatar">
                <i class="fa-solid fa-robot"></i>
            </div>
            <div class="chat-bubble loading-bubble">
                <div class="chat-sender-name">SmartCare Agent</div>
                <div class="typing-indicator-container">
                    <div class="typing-indicator">
                        <span></span><span></span><span></span>
                    </div>
                    <p class="loading-text">Analyzing patient data...</p>
                </div>
            </div>
        </div>
    </template>

    <!-- Hidden Template for Agent Result Message -->
    <template id="tpl-agent-result">
        <div class="chat-message agent animate-pop-in">
            <div class="chat-avatar">
                <i class="fa-solid fa-robot"></i>
            </div>
            <div class="chat-bubble result-bubble">
                <div class="chat-sender-name">SmartCare Agent</div>

                <div class="chat-result-header">
                    <h4>Prediction Complete</h4>
                    <span class="model-badge-inline"></span>
                </div>

                <div class="result-display-row chat-result-row">
                    <!-- Circular Gauge -->
                    <div class="circle-gauge-container chat-gauge">
                        <svg class="circle-gauge-svg" viewBox="0 0 120 120">
                            <circle class="circle-bg" cx="60" cy="60" r="50"></circle>
                            <circle class="circle-fill chat-circle-progress" cx="60" cy="60" r="50"></circle>
                        </svg>
                        <div class="circle-content">
                            <span class="circle-percent"></span>
                            <span class="circle-risk-text"></span>
                        </div>
                    </div>

                    <!-- Text -->
                    <div class="result-text-container">
                        <h3 class="result-status-title"></h3>
                        <p class="result-description"></p>
                    </div>
                </div>

                <div class="shap-container chat-shap-container">
                    <h5 class="shap-title"><i class="fa-solid fa-magnifying-glass-chart"></i> Factors Impacting Risk
                    </h5>
                    <div class="shap-list chat-shap-list"></div>
                </div>

            </div>
        </div>
    </template>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
